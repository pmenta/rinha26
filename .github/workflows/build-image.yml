# Builda e publica a imagem `rinha26-api` no GitHub Container Registry (ghcr.io)
# em todo push para `main` e em tags `v*`. A imagem é referenciada pelo
# `docker-compose.yml` da branch `submission` (ver `submission.yml`).
#
# **Por que ghcr.io?** Gratuito para repositórios públicos, integrado com
# `GITHUB_TOKEN` (sem secret extra), e permite multi-arch — embora aqui só
# precisamos de `linux/amd64` (vide `docs/ARQUITETURA.md` e `AGENTS.md` §Infra).

name: Build & publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: ghcr.io/${{ github.repository_owner }}/rinha26-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rinha26-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rinha26-api-publish
          cache-to: type=gha,mode=max,scope=rinha26-api-publish
