# Configuração do nginx como load balancer puro entre as 2 réplicas da API
# (`api1`, `api2`). Sem lógica de detecção — só round-robin.
#
# Restrições de `docs/ARQUITETURA.md`:
#   - Porta exposta: 9999.
#   - LB sem inspeção/condicional/transformação de payload.
#   - Modo `bridge` (não `host`).
#
# Otimizações dado o orçamento de 1 CPU / 350MB total:
#   - 1 worker process (LB stateless, 1 já satura para esta carga).
#   - `worker_connections` alto (1024) sem custo de memória relevante.
#   - `keepalive` upstream para reaproveitar conexão TCP com api1/api2.
#   - `proxy_buffering off` reduz latência (não acumula response do upstream).

worker_processes 1;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    # Upstream: round-robin (default) entre as duas réplicas.
    # `max_fails=0`: nunca marcar upstream como "down" — uma única req lenta
    # (ex.: cold JIT) não pode tirar a réplica inteira do round-robin
    # (vide hurdle no AGENTS.md §11 e ADR-005).
    upstream rinha_api {
        server api1:3000 max_fails=0;
        server api2:3000 max_fails=0;
        keepalive 64;
    }

    server {
        listen 9999 default_server;
        listen [::]:9999 default_server;

        server_name _;

        # Sem buffering — cada byte do upstream vai direto ao cliente.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Headers úteis (manter mínimos para reduzir custo).
        proxy_set_header Host $host;

        # Timeouts: 5s de folga para a primeira req real após o warmup
        # (ainda dentro do timeout de 2001ms do k6 OFICIAL pq esse é o
        # timeout do CLIENTE; o nginx só responde mais tarde se o upstream
        # quiser). Em regime quente, todas respondem em ms.
        proxy_connect_timeout 1s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        location / {
            proxy_pass http://rinha_api;
        }
    }
}
